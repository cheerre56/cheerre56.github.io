const STORE='nik-gym-os:logs:v1';
const dayNames=['週一','週二','週三','週四','週五','週六','週日'];
let logs={};try{const raw=localStorage.getItem(STORE); if(raw) logs=JSON.parse(raw)||{};}catch(e){logs={};}
let tab='plan',selectedDow=(new Date().getDay()+6)%7,weekStart=startMonday(new Date()),openDetails={},expandedLib={},searchTerm='';
let timer={visible:false,running:false,deadline:0,remaining:90,initial:90};
function pad(n){return String(n).padStart(2,'0')}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function startMonday(d){const v=new Date(d.getFullYear(),d.getMonth(),d.getDate());v.setDate(v.getDate()-(v.getDay()+6)%7);return v}
function atDay(dow){const d=new Date(weekStart);d.setDate(d.getDate()+dow);return d}
function fmt(d){return (d.getMonth()+1)+'/'+d.getDate()}
function html(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(STORE,JSON.stringify(logs))}catch(e){notify('儲存失敗：請確認瀏覽器允許網站資料')}}
function notify(s){const n=document.getElementById('toast');n.textContent=s;n.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>n.classList.remove('show'),2500)}
function dayLog(dow){const key=dateKey(atDay(dow));return logs[key]??(logs[key]={})}
function exLog(dow,id){const dl=dayLog(dow);return dl[id]??(dl[id]={sets:[],complete:false,note:''})}
function configFor(dow,id){return {...DB.exercises[id],...(DB.days[dow].overrides?.[id]||{})}}
function statsFor(dow){const day=DB.days[dow],current=logs[dateKey(atDay(dow))]||{};let total=0,done=0;
for(const id of day.items){const x=configFor(dow,id),data=current[id]||{};const n=x.kind==='strength'?x.sets:1;total+=n;if(x.kind==='strength') done+=Array.from({length:n},(_,i)=>data.sets?.[i]?.done?1:0).reduce((a,b)=>a+b,0);else if(data.complete)done++}return {total,done,percent:total?Math.round(done/total*100):0}}
function weekStats(){let s=0,t=0,training=0;for(let i=0;i<7;i++){const a=statsFor(i);s+=a.done;t+=a.total;if(DB.days[i].type==='strength'&&a.total&&a.done===a.total)training++}return {done:s,total:t,percent:t?Math.round(s/t*100):0,training}}
function renderStats(){const w=weekStats();document.getElementById('stats').innerHTML=`<div class="stat"><div class="stat-num">${w.percent}%</div><div class="stat-label">本週完成度</div></div><div class="stat"><div class="stat-num">${w.done}<span style="font-size:16px;color:var(--muted)"> / ${w.total}</span></div><div class="stat-label">本週完成組數／項目</div></div><div class="stat"><div class="stat-num">${w.training}<span style="font-size:16px;color:var(--muted)"> / 4</span></div><div class="stat-label">完整重訓日</div></div><div class="stat"><div class="stat-num">8<span style="font-size:16px;color:var(--muted)"> 週</span></div><div class="stat-label">建議先執行並觀察</div></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'));renderStats();document.getElementById('app').innerHTML=tab==='plan'?renderPlan():tab==='library'?renderLibrary():tab==='posture'?renderPosture():renderRecords();}
function dayButtons(mobile){return DB.days.map((d,i)=>{const x=statsFor(i),a=i===selectedDow;return `<button class="daybtn ${a?'active':''}" data-action="select-day" data-dow="${i}" ${a?'aria-current="date"':''}><span class="daycode">${d.small}</span><span class="daytext"><strong>${d.name}</strong><span>${html(d.focus)}</span></span>${x.total&&x.done===x.total?'<span class="daycheck">✓</span>':''}</button>`}).join('')}
function renderPlan(){const d=DB.days[selectedDow],stats=statsFor(selectedDow),date=atDay(selectedDow),today=dateKey(new Date())===dateKey(date);return `<div class="workspace"><aside class="sidebar"><div class="side-head"><span class="side-label">WEEKLY ROUTINE</span><span class="small">MON–SUN</span></div><div class="daylist">${dayButtons(false)}</div><div class="side-foot">點選日期查看詳細器械與每組紀錄。<br>資料保留在目前使用的瀏覽器。</div></aside><div class="main-panel"><div class="weekbar"><div><div class="small">本次查看的週次 ${today?' · 今天':''}</div><div class="week-range">${fmt(weekStart)} — ${fmt(atDay(6))}</div></div><div class="weeknav"><button data-action="prev-week" title="上週">←</button><button data-action="today">本週</button><button data-action="next-week" title="下週">→</button></div></div><div class="mobile-days">${dayButtons(true)}</div><section class="section-head"><div class="section-kicker">${d.small} · ${fmt(date)} · ${d.type==='strength'?'STRENGTH':d.type==='rest'?'REST':'RECOVERY'}</div><h2>${d.name}</h2><p>${html(d.description)}</p><div class="session-bottom"><span>◎ ${html(d.focus)}</span><span>◷ ${html(d.duration)}</span><span>${d.items.length} 個動作</span></div></section>${d.type==='rest'?`<div class="empty">☕ 今天沒有重量訓練。<br>睡眠、補充水分、輕鬆散步就很好。</div>`:`<div class="bar-wrap"><strong>今日完成進度</strong><small>${stats.done} / ${stats.total} 組／項目 · ${stats.percent}%</small></div><div class="progress-track"><div class="progress-fill" style="width:${stats.percent}%"></div></div>${d.items.map((id,i)=>renderExercise(id,i,selectedDow)).join('')}`}<div class="advice"><b>新手訓練原則</b><br>重訓先暖身 5–10 分鐘；前兩週每動作可先做 2 組。選擇能控制、約保留 2–3 下餘力的重量，複合動作休息 2–3 分鐘。教練課已練過的組數不用重複加做。</div></div></div>`}
function renderExercise(id,index,dow){const x=configFor(dow,id),st=exLog(dow,id),isStrength=x.kind==='strength',count=isStrength?x.sets:1,complete=isStrength?Array.from({length:count},(_,i)=>st.sets?.[i]?.done?1:0).reduce((a,b)=>a+b,0):st.complete?1:0,open=!!openDetails[dow+'-'+id];return `<article class="exercise ${complete===count?'done':''}"><div class="exercise-top"><span class="ex-index">${pad(index+1)}</span><div class="ex-main"><div class="ex-title">${html(x.name)}</div><div class="en">${html(x.en)}</div></div><div class="ex-counters">${complete}/${count}</div></div><div class="chips"><span class="chip">${html(x.muscle)}</span><span class="chip">${html(x.equip)}</span><span class="chip">${x.sets} 組 × ${html(x.reps)}</span></div><div class="hint">${html(x.tip)}</div>${isStrength?`<div class="setarea"><div class="sethead"><b>SET TRACKER · 每組紀錄</b><small>重量和次數可留空</small></div><div class="setrows">${Array.from({length:x.sets},(_,i)=>{const v=st.sets?.[i]||{};return `<div class="setrow"><span>SET ${i+1}</span><label class="setinput"><input aria-label="第 ${i+1} 組重量" type="number" min="0" max="600" step="0.5" inputmode="decimal" placeholder="—" value="${html(v.weight??'')}" data-input="weight" data-id="${id}" data-set="${i}"><small>kg</small></label><label class="setinput"><input aria-label="第 ${i+1} 組實際次數" type="number" min="0" max="999" step="1" inputmode="numeric" placeholder="—" value="${html(v.reps??'')}" data-input="reps" data-id="${id}" data-set="${i}"><small>次</small></label><button class="donebtn" data-action="toggle-set" data-id="${id}" data-set="${i}" aria-pressed="${v.done?'true':'false'}">${v.done?'✓ 完成':'完成'}</button></div>`}).join('')}</div></div>`:`<div class="lite-row"><button class="litebtn" data-action="toggle-lite" data-id="${id}" aria-pressed="${st.complete?'true':'false'}">${st.complete?'✓ 已完成這個項目':'✓ 完成這個項目'}</button></div>`}<div class="exercise-actions"><button class="detailsbtn" data-action="toggle-details" data-id="${id}">${open?'收合器械與動作說明 ↑':'查看器械與動作說明 ↓'}</button>${x.rest?`<button class="restbtn" data-action="rest" data-seconds="${x.rest}">◷ 休息 ${x.rest>=60?Math.floor(x.rest/60)+'分'+(x.rest%60?pad(x.rest%60)+'秒':''):x.rest+'秒'}</button>`:''}</div>${open?`<div class="details">${detailMarkup(x)}<textarea class="note" rows="2" placeholder="這次的動作感覺、座椅刻度、教練提醒…" data-input="note" data-id="${id}">${html(st.note||'')}</textarea></div>`:''}</article>`}
function detailMarkup(x){const url='https://www.youtube.com/results?search_query='+encodeURIComponent(x.video);return `<div><h4>器械／器材</h4><div class="altern">${html(x.equip)}</div></div><div><h4>動作步驟</h4><ol>${x.steps.map(s=>`<li>${html(s)}</li>`).join('')}</ol></div><div><h4>常見錯誤</h4><ul class="warn">${x.errors.map(s=>`<li>${html(s)}</li>`).join('')}</ul></div><div><h4>做不到時怎麼替換？</h4><div class="altern">${html(x.alternative)}</div></div><a class="video" href="${url}" target="_blank" rel="noopener noreferrer">▶ 在 YouTube 搜尋示範影片 ↗</a><span class="small">影片搜尋會開啟新頁面，不在此網站嵌入播放。</span>`}
function renderLibrary(){const all=Object.values(DB.exercises).filter(x=>x.id!=='rest'),matched=all.filter(x=>(x.name+x.en+x.equip+x.muscle).toLowerCase().includes(searchTerm.toLowerCase()));return `<div class="section-head"><div class="section-kicker">EXERCISE LIBRARY</div><h2>動作資料庫</h2><p>找不到器材名稱？可以搜尋「胸推、二頭、划船、啞鈴」等，查看器械、動作步驟、常見錯誤與替代方案。</p></div><input class="search" id="search" type="search" placeholder="搜尋動作 / 器械 / 肌群…" value="${html(searchTerm)}" aria-label="搜尋動作資料庫"><div id="library-results">${renderLibList(matched)}</div>`}
function renderLibList(all){return all.length?`<div class="library-grid">${all.map(x=>`<article class="lib-card"><h3>${html(x.name)}</h3><div class="en">${html(x.en)}</div><p>${html(x.equip)}<br>${html(x.muscle)}</p><div class="lib-actions"><button class="detailsbtn" data-action="lib-details" data-id="${x.id}">${expandedLib[x.id]?'收合教學 ↑':'展開教學 ↓'}</button><span class="small">${x.sets} 組</span></div>${expandedLib[x.id]?`<div class="lib-details">${detailMarkup(x)}</div>`:''}</article>`).join('')}</div>`:`<div class="empty">沒有符合的動作，換個關鍵字試試。</div>`}
function renderPosture(){return `<section class="section-head"><div class="section-kicker">POSTURE & MOVEMENT</div><h2>體態訓練，不是硬挺直</h2><p>你的目標包含改善圓肩、頭部前傾，以及觀察肩膀高低差。重點是肩胛、頸部與軀幹的可控制活動，而不是整天夾緊肩膀。</p></section><div class="info-grid"><article class="info-card"><div class="kicker">01 / 肩胛控制</div><h3>前鋸肌、中下斜方肌</h3><p>可練 Wall Slide、胸靠墊／坐姿划船、輕重量 Y Raise。注意讓肩胛在動作中自然移動，而不是強迫每秒都後夾。</p></article><article class="info-card"><div class="kicker">02 / 肩部穩定</div><h3>後三角與旋轉肌</h3><p>可練 Face Pull、輕彈力帶肩外旋。動作時避免明顯聳肩或肩膀前側刺痛。</p></article><article class="info-card"><div class="kicker">03 / 頸部控制</div><h3>深層頸屈肌</h3><p>Chin Tuck 是輕微水平收下巴，不要用力把頭往牆壓，也不要過度低頭。</p></article><article class="info-card"><div class="kicker">04 / 髖與下肢</div><h3>先學髖鉸鏈，再加重</h3><p>RDL 不需要亞洲蹲。髖向後推、膝微彎，小腿大致接近垂直。你目前可先用臀推機、腿彎舉機；讓教練確認髖鉸鏈後再加 RDL。</p></article></div><div class="warning"><b>關於高低肩</b><br>高低肩不一定由單一肌肉緊繃造成，也不能直接判定脊椎側彎。若差異持續明顯、伴隨肩頸疼痛、麻木或單側無力，建議由復健科或物理治療師評估，不要自行只強化某一側。</div><div class="advice" style="margin-top:15px"><b>建議的最小習慣</b><br>週三與週日各完成 10 分鐘體態動作＋低強度有氧；其他天有空再做一輪即可。活動、睡眠與持續練習，比刻意維持僵硬「完美姿勢」更重要。</div>`}
function renderRecords(){const w=weekStats();return `<section class="section-head"><div class="section-kicker">TRAINING LOGBOOK</div><h2>你的訓練紀錄</h2><p>每次輸入的重量、次數與完成狀態都會記在該日期。資料只存在這個瀏覽器的本機儲存空間。</p></section><div class="info-card"><div class="weekbar"><b>本次查看週次：${fmt(weekStart)} – ${fmt(atDay(6))}</b><div class="weeknav"><button data-action="prev-week">←</button><button data-action="today">本週</button><button data-action="next-week">→</button></div></div><div class="small">本週完成 ${w.done} / ${w.total} 組／項目，完成度 ${w.percent}%</div><div class="week-list">${DB.days.map((d,i)=>{const s=statsFor(i);return `<div class="weekcell"><small>${dayNames[i]}</small><b>${s.percent}%</b><small>${s.done}/${s.total}</small></div>`}).join('')}</div></div><div class="info-grid" style="margin-top:14px"><div class="info-card"><h3>備份與轉移</h3><p>要在 iPhone 與電腦之間轉移紀錄，請先匯出 JSON，再在另一個裝置匯入。<b>不會透過私人伺服器自動同步</b>。</p><div class="settings-actions"><button class="primary" data-action="export">↓ 匯出 JSON 備份</button><button class="secondary" data-action="import">↑ 匯入備份</button></div><input id="import-input" type="file" accept=".json,application/json" style="display:none"></div><div class="info-card"><h3>在 iPhone 上快速開啟</h3><p>用 Safari 打開你上傳的網站，點選「分享」→「加入主畫面」，就能像 App 一樣從主畫面打開。網站請盡量使用 HTTPS。</p><p class="privacy">提醒：無痕模式、清除網站資料、更換網址／瀏覽器，都可能讓本地紀錄無法顯示。</p><button class="secondary danger" data-action="clear-current">清除本週紀錄</button></div></div><div class="advice"><b>如何追蹤進步？</b><br>當你能用穩定姿勢做到目標次數的上限，且還有約 2 下餘力，下次再小幅加重量。同時每週量一次腰圍、看 7 天平均體重；不要只用單次 InBody 評分判斷進步。</div>`}
function refreshLib(){if(tab!=='library')return;const all=Object.values(DB.exercises).filter(x=>x.id!=='rest'&&(x.name+x.en+x.equip+x.muscle).toLowerCase().includes(searchTerm.toLowerCase()));const node=document.getElementById('library-results');if(node)node.innerHTML=renderLibList(all)}
function setDateWeek(n){weekStart.setDate(weekStart.getDate()+7*n);render()}
function startTimer(seconds){timer={visible:true,running:true,remaining:seconds,initial:seconds,deadline:Date.now()+seconds*1000};drawTimer()}
function drawTimer(){const panel=document.getElementById('timer');panel.classList.toggle('visible',timer.visible);if(!timer.visible)return;const sec=timer.running?Math.max(0,Math.ceil((timer.deadline-Date.now())/1000)):timer.remaining;document.getElementById('timer-time').textContent=pad(Math.floor(sec/60))+':'+pad(sec%60);document.getElementById('timer-toggle').textContent=timer.running?'暫停':'繼續';if(timer.running&&sec===0){timer.running=false;timer.remaining=0;notify('休息結束，可以開始下一組了！')}}
setInterval(drawTimer,250);setInterval(()=>{const d=new Date();document.getElementById('header-time').textContent=pad(d.getHours())+':'+pad(d.getMinutes())},1000);
document.addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;window.scrollTo({top:0,behavior:'smooth'});render();return}const a=e.target.closest('button[data-action]');if(!a)return;const op=a.dataset.action,id=a.dataset.id,dow=selectedDow;
if(op==='select-day'){selectedDow=Number(a.dataset.dow);render();return}
if(op==='prev-week'){setDateWeek(-1);return}if(op==='next-week'){setDateWeek(1);return}
if(op==='today'){weekStart=startMonday(new Date());selectedDow=(new Date().getDay()+6)%7;tab='plan';render();return}
if(op==='toggle-details'){const key=dow+'-'+id;openDetails[key]=!openDetails[key];render();return}
if(op==='toggle-set'){const st=exLog(dow,id),idx=Number(a.dataset.set);st.sets ||= [];st.sets[idx] ||= {};st.sets[idx].done=!st.sets[idx].done;save();render();return}
if(op==='toggle-lite'){const st=exLog(dow,id);st.complete=!st.complete;save();render();return}
if(op==='lib-details'){expandedLib[id]=!expandedLib[id];refreshLib();return}
if(op==='rest'){startTimer(Number(a.dataset.seconds));return}
if(op==='close-timer'){timer.visible=false;timer.running=false;drawTimer();return}
if(op==='timer-toggle'){if(timer.running){timer.remaining=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));timer.running=false}else{timer.running=true;timer.deadline=Date.now()+timer.remaining*1000}drawTimer();return}
if(op==='timer-plus'){if(timer.running)timer.deadline+=30000;else timer.remaining+=30;drawTimer();return}
if(op==='timer-reset'){startTimer(timer.initial);return}
if(op==='export'){const blob=new Blob([JSON.stringify({app:'NIK Gym OS',version:1,exportedAt:new Date().toISOString(),logs},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='NIK_訓練紀錄_'+dateKey(new Date())+'.json';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),500);notify('已建立 JSON 備份檔');return}
if(op==='import'){let input=document.getElementById('import-input');if(!input){tab='records';render();input=document.getElementById('import-input')}input.click();return}
if(op==='clear-current'){if(!confirm('確定要清除目前查看的整週訓練紀錄嗎？此操作無法還原，建議先匯出備份。'))return;for(let i=0;i<7;i++)delete logs[dateKey(atDay(i))];save();render();notify('已清除此週紀錄');return}
});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='import-input'){const file=t.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='NIK Gym OS'||!data.logs||typeof data.logs!=='object'||Array.isArray(data.logs))throw Error('不是正確的 NIK Gym OS 備份');if(!confirm('匯入會取代這個瀏覽器目前所有的訓練紀錄，確定繼續？'))return;logs=data.logs;save();render();notify('已成功匯入備份')}catch(err){alert('匯入失敗：'+err.message)}return}
if(t.dataset.input){const st=exLog(selectedDow,t.dataset.id),key=t.dataset.input;if(key==='note'){st.note=t.value}else{const idx=Number(t.dataset.set);st.sets ||= [];st.sets[idx] ||= {};st.sets[idx][key]=t.value}save()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){searchTerm=e.target.value;refreshLib()}});
render();drawTimer();document.getElementById('header-time').textContent=pad(new Date().getHours())+':'+pad(new Date().getMinutes());
</script>
</body>
</html>
