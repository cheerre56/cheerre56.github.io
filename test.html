<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>體態重組訓練計畫</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#151f31;--panel2:#1c2940;--text:#f3f6fc;--muted:#9ba9bf;--line:#2a3850;--accent:#818cf8;--cyan:#67e8f9;--green:#34d399;--danger:#fb7185}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.app{width:100%;max-width:560px;min-height:100dvh;margin:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.view{display:flex;flex-direction:column;flex:1;animation:fade .18s ease-out}.hidden{display:none!important}@keyframes fade{from{opacity:.65;transform:translateY(4px)}to{opacity:1;transform:none}}header{padding-top:calc(16px + env(safe-area-inset-top))}.hero{text-align:center;padding:22px 0 24px}.eyebrow{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800}.hero h1{font-size:clamp(1.7rem,7vw,2.2rem);margin:8px 0;background:linear-gradient(90deg,#a5b4fc,#67e8f9);color:transparent;background-clip:text}.muted{color:var(--muted)}.small{font-size:.85rem}.day-card,.panel,.exercise-row{background:var(--panel);border:1px solid var(--line);border-radius:18px}.day-card{width:100%;padding:17px;display:flex;align-items:center;gap:13px;text-align:left;color:inherit;margin-bottom:12px;min-height:88px}.day-card:active,.primary:active,.secondary:active{transform:scale(.985)}.day-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:var(--panel2);font-size:1.5rem;flex-shrink:0}.day-copy{flex:1;min-width:0}.day-copy strong{display:block;font-size:1.02rem;margin-bottom:5px}.day-copy span{display:block;color:var(--muted);font-size:.84rem;line-height:1.4}.arrow{color:var(--muted);font-size:1.4rem}.topbar{display:flex;align-items:center;gap:10px;margin:8px 0 18px}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;font-size:1.3rem;flex-shrink:0}.topbar h2{font-size:1.2rem;margin:0}.exercise-list{display:grid;gap:10px}.exercise-row{display:flex;gap:12px;align-items:center;padding:13px}.num{width:32px;height:32px;border-radius:50%;background:#3730a3;color:#e0e7ff;display:grid;place-items:center;font-weight:800;flex-shrink:0}.exercise-row strong{display:block;font-size:.94rem;line-height:1.35}.exercise-row p{margin:5px 0 0;font-size:.8rem;color:var(--muted);line-height:1.45}.sticky-action{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom));margin-top:16px;background:linear-gradient(0deg,var(--bg) 75%,transparent)}.primary,.secondary{border:0;border-radius:14px;padding:15px 16px;font-weight:800;min-height:52px;transition:transform .12s,background .15s}.primary{background:linear-gradient(100deg,#6366f1,#0891b2);color:white;width:100%}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.workout-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px;margin-bottom:14px}.progress-wrap{min-width:0}.progress-text{text-align:center;font-size:.82rem;color:var(--muted);margin-bottom:8px}.progress-track{height:5px;background:var(--line);border-radius:9px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));width:0;transition:width .2s}.workout-title{font-size:1.45rem;line-height:1.25;text-align:center;margin:6px 0 16px}.video-box{position:relative;width:100%;aspect-ratio:16/9;background:#030712;border-radius:16px;overflow:hidden;border:1px solid var(--line)}.video-box iframe{width:100%;height:100%;border:0;display:block}.video-placeholder{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;gap:9px;color:var(--muted)}.video-placeholder .play{font-size:2.2rem}.video-actions{display:flex;gap:8px;margin-top:10px}.video-actions a{flex:1;text-decoration:none;text-align:center;padding:11px 8px;border-radius:12px;border:1px solid var(--line);color:#dbeafe;background:var(--panel);font-size:.85rem;font-weight:700}.panel{padding:15px;margin-top:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--panel2);border-radius:13px;padding:13px 9px;text-align:center;min-width:0}.stat-label{font-size:.72rem;color:var(--muted);margin-bottom:6px}.stat-value{font-weight:800;line-height:1.35;overflow-wrap:anywhere}.sets-value{color:#c7d2fe}.weight-value{color:var(--cyan)}.log{margin-top:14px}.log-title{font-weight:800;font-size:.95rem;margin-bottom:10px}.set-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.set-check{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 4px;border:1px solid var(--line);border-radius:11px;background:#111a2a;font-size:.8rem}.set-check input{width:18px;height:18px;accent-color:#818cf8}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.field label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:6px}.field input{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:#0b1220;color:var(--text);padding:11px}.note{font-size:.78rem;color:var(--muted);line-height:1.5;margin:12px 0 0}.workout-actions{display:grid;grid-template-columns:1fr 1.45fr;gap:10px;margin-top:14px;padding-bottom:10px}.workout-actions button{min-width:0}.timer-row{display:flex;align-items:center;gap:10px;margin-top:12px}.timer-row .secondary{padding:10px 12px;min-height:42px}.timer-display{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem;min-width:64px}.summary-score{font-size:2rem;font-weight:900;color:var(--green);margin:10px 0}.summary-list{display:grid;gap:8px;margin:16px 0}.summary-item{display:flex;justify-content:space-between;gap:10px;background:var(--panel);padding:12px;border-radius:12px;font-size:.88rem}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#e2e8f0;color:#0f172a;padding:10px 14px;border-radius:12px;font-size:.85rem;font-weight:700;z-index:10;box-shadow:0 6px 24px #0006;max-width:90vw;text-align:center}.section-label{margin:18px 0 10px;color:var(--muted);font-size:.78rem;font-weight:800;letter-spacing:.05em}
@media(min-width:520px){.app{padding-left:22px;padding-right:22px}.hero{padding-top:32px}.day-card{padding:20px}}
@media(max-height:700px){.workout-title{font-size:1.2rem;margin:4px 0 10px}.panel{padding:12px;margin-top:12px}.stat{padding:10px 7px}.hero{padding-top:12px;padding-bottom:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<section id="view-home" class="view">
<header class="hero"><div class="eyebrow">Fitness Plan</div><h1>體態重組計畫</h1><p class="muted">Hello NIK 選擇今日訓練課表</p></header>
<div id="home-buttons"></div>
<p class="note">小提醒：建議重量僅供起始參考，請依自身狀態調整；動作有疼痛或不適時請停止。</p>
</section>
<section id="view-overview" class="view hidden">
<header class="topbar"><button class="icon-btn" id="back-home" aria-label="返回首頁">‹</button><h2 id="overview-title">訓練日</h2></header>
<div id="overview-list" class="exercise-list"></div>
<div class="sticky-action"><button class="primary" id="start-workout">開始訓練</button></div>
</section>
<section id="view-workout" class="view hidden">
<div class="workout-head"><button class="icon-btn" id="exit-workout" aria-label="離開訓練">×</button><div class="progress-wrap"><div class="progress-text" id="workout-progress">1 / 5</div><div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div></div><div></div></div>
<h2 id="workout-ex-name" class="workout-title">動作名稱</h2>
<div class="video-box" id="video-box"><div class="video-placeholder"><div class="play">▶</div><strong>準備載入教學影片…</strong><span class="small">若內嵌播放器無法使用，可改用 YouTube 搜尋</span></div></div>
<div class="video-actions"><a id="youtube-search" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">在 YouTube 搜尋此動作 ↗</a><a id="youtube-direct" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">開啟 YouTube ↗</a></div>
<div class="panel"><div class="stats"><div class="stat"><div class="stat-label">組數與次數</div><div id="workout-sets" class="stat-value sets-value">3 組 x 12 次</div></div><div class="stat"><div class="stat-label">建議重量 / 設定</div><div id="workout-weight" class="stat-value weight-value">10 kg</div></div></div>
<div class="log"><div class="log-title">本動作完成紀錄</div><div id="set-list" class="set-list"></div><div class="field-row"><div class="field"><label for="actual-weight">實際重量（kg）</label><input id="actual-weight" inputmode="decimal" type="number" min="0" step="0.5" placeholder="例如 12"></div><div class="field"><label for="actual-reps">每組目標次數</label><input id="actual-reps" inputmode="numeric" type="number" min="1" step="1" placeholder="例如 12"></div></div>
<div class="timer-row"><div><div class="stat-label">組間休息</div><div class="timer-display" id="timer-display">01:30</div></div><button class="secondary" id="timer-start">開始計時</button><button class="secondary" id="timer-reset">重設</button></div><p class="note">完成一組就勾選一次。紀錄會自動保存在這台裝置的瀏覽器中。</p></div></div>
<div class="workout-actions"><button class="secondary" id="btn-prev">上一個</button><button class="primary" id="btn-next">下一個動作</button></div>
</section>
<section id="view-summary" class="view hidden"><header class="topbar"><button class="icon-btn" id="summary-home" aria-label="返回首頁">‹</button><h2>本次訓練摘要</h2></header><div class="panel"><div class="muted">今日訓練</div><h2 id="summary-title"></h2><div id="summary-score" class="summary-score">0 / 0 組</div><p id="summary-message" class="muted"></p></div><div id="summary-list" class="summary-list"></div><button class="primary" id="summary-done">回到首頁</button></section>
</main><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
const workoutPlan=[
{id:1,title:'Day 1：上半身 A',subtitle:'胸肌厚度 ＋ 三頭肌',icon:'🔥',exercises:[
{name:'靠牆收下巴（熱身）',sets:'2 組 × 12 次（停 5 秒）',count:2,reps:'12 次（停 5 秒）',weight:'徒手',video:'20Q4uB-5P2E'},
{name:'平板啞鈴臥推',sets:'4 組 × 8–12 次',count:4,reps:'8–12 次',weight:'單手 8–18 kg',video:'UVtsazkPfC0'},
{name:'上斜啞鈴臥推',sets:'3 組 × 8–12 次',count:3,reps:'8–12 次',weight:'單手 8–14 kg',video:'C5yhW8Kivl4'},
{name:'蝴蝶機夾胸',sets:'3 組 × 12 次',count:3,reps:'12 次',weight:'25–45 kg',video:'eGjt4jcWAjY'},
{name:'滑輪三頭肌下壓',sets:'4 組 × 12–15 次',count:4,reps:'12–15 次',weight:'10–25 kg',video:'2-LAMcpzODU'}]},
{id:2,title:'Day 2：下半身 ＋ 核心',subtitle:'下肢訓練 ＋ 核心 ＋ 有氧',icon:'🦵',exercises:[
{name:'單膝跪姿弓箭步伸展',sets:'2 組 × 45 秒',count:2,reps:'45 秒',weight:'徒手',video:'YQldWOGKsXY'},
{name:'機械式腿推機',sets:'4 組 × 10–12 次',count:4,reps:'10–12 次',weight:'60–120 kg',video:'IZxyjW7OSvc'},
{name:'啞鈴高腳杯深蹲',sets:'3 組 × 10–12 次',count:3,reps:'10–12 次',weight:'10–24 kg',video:'Lv3o4K12rvo'},
{name:'坐姿腿彎舉',sets:'3 組 × 12 次',count:3,reps:'12 次',weight:'25–45 kg',video:'F488k67BTNo'},
{name:'死蟲式',sets:'3 組 × 共 16 次',count:3,reps:'共 16 次',weight:'徒手',video:'4XLEnwUr1d8'},
{name:'跑步機坡度快走',sets:'20 分鐘',count:1,reps:'20 分鐘',weight:'坡度 8–10 / 速度 5.0',video:'7R59PjU9bXQ'}]},
{id:3,title:'Day 3：上半身 B',subtitle:'背部訓練 ＋ 二頭肌',icon:'🏋️',exercises:[
{name:'繩索面拉',sets:'3 組 × 15 次',count:3,reps:'15 次',weight:'7.5–20 kg',video:'V8d6XjgIGPE'},
{name:'寬握滑輪下拉',sets:'4 組 × 10–12 次',count:4,reps:'10–12 次',weight:'30–55 kg',video:'9kDT2RJSnyE'},
{name:'坐姿划船機',sets:'4 組 × 10–12 次',count:4,reps:'10–12 次',weight:'30–55 kg',video:'GZbfZ033f74'},
{name:'啞鈴二頭肌彎舉',sets:'4 組 × 10–12 次',count:4,reps:'10–12 次',weight:'單手 6–12 kg',video:'ykJmrZ5v0Oo'},
{name:'槌式彎舉',sets:'3 組 × 10–12 次',count:3,reps:'10–12 次',weight:'單手 6–12 kg',video:'zC3nLlEvin4'}]},
{id:4,title:'Day 4：寬肩 ＋ 有氧',subtitle:'肩部訓練 ＋ 核心 ＋ 有氧',icon:'🎯',exercises:[
{name:'啞鈴側平舉',sets:'5 組 × 12–15 次',count:5,reps:'12–15 次',weight:'單手 4–8 kg',video:'WJm94H5JvB0'},
{name:'反向飛鳥機',sets:'3 組 × 12 次',count:3,reps:'12 次',weight:'15–30 kg',video:'bB5e6bFf1jA'},
{name:'平板支撐（Plank）',sets:'3 組 × 45 秒',count:3,reps:'45 秒',weight:'徒手',video:'pSHjTRCQxIw'},
{name:'跑步機坡度快走',sets:'25 分鐘',count:1,reps:'25 分鐘',weight:'坡度 9–11 / 速度 5.2',video:'7R59PjU9bXQ'}]}
];

let currentDayIndex=0,currentExerciseIndex=0,timerSeconds=90,timerInterval=null,timerEnd=0;
const $=id=>document.getElementById(id);const storeKey='fitness-plan-records-v2';
function loadRecords(){try{return JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){return {}}}let records=loadRecords();
function saveRecords(){try{localStorage.setItem(storeKey,JSON.stringify(records))}catch(e){showToast('瀏覽器未允許儲存，這次紀錄可能不會保留')}}
function recordKey(){return `${workoutPlan[currentDayIndex].id}-${currentExerciseIndex}`}
function getRecord(){return records[recordKey()]||{done:[],weight:'',reps:''}}
function setRecord(next){records[recordKey()]=next;saveRecords()}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(showToast.timeout);showToast.timeout=setTimeout(()=>t.classList.add('hidden'),2400)}
function navigate(name){document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));$('view-'+name).classList.remove('hidden');window.scrollTo({top:0,behavior:'instant'});if(name!=='workout')stopTimer();}

function renderHome(){const host=$('home-buttons');host.innerHTML='';workoutPlan.forEach((day,i)=>{const b=document.createElement('button');b.className='day-card';b.innerHTML=`<div class="day-icon">${day.icon}</div><div class="day-copy"><strong>${day.title}</strong><span>${day.subtitle} · ${day.exercises.length} 個動作</span></div><span class="arrow" aria-hidden="true">›</span>`;b.addEventListener('click',()=>selectDay(i));host.appendChild(b)})}
function selectDay(i){currentDayIndex=i;const day=workoutPlan[i];$('overview-title').textContent=day.title;const list=$('overview-list');list.innerHTML='';day.exercises.forEach((ex,j)=>{const item=document.createElement('div');item.className='exercise-row';item.innerHTML=`<div class="num">${j+1}</div><div><strong>${ex.name}</strong><p>${ex.sets} · ${ex.weight}</p></div>`;list.appendChild(item)});$('start-workout').textContent=`開始訓練 · ${day.exercises.length} 個動作`;navigate('overview')}
function searchUrl(ex){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(ex.name+' 正確姿勢 教學')}
function setVideo(ex){const box=$('video-box');box.innerHTML='';const id=(ex.video||'').trim();if(id){const iframe=document.createElement('iframe');iframe.title=ex.name+' YouTube 教學影片';iframe.loading='lazy';iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.allowFullscreen=true;iframe.referrerPolicy='strict-origin-when-cross-origin';iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?playsinline=1&rel=0';box.appendChild(iframe)}else{box.innerHTML='<div class="video-placeholder"><div class="play">▶</div><strong>目前沒有指定影片</strong><span class="small">請使用下方搜尋按鈕尋找教學</span></div>'} $('youtube-search').href=searchUrl(ex);$('youtube-search').textContent='搜尋「'+ex.name+'」↗';$('youtube-direct').href=id?'https://www.youtube.com/watch?v='+encodeURIComponent(id):searchUrl(ex);$('youtube-direct').textContent=id?'直接開啟影片 ↗':'開啟搜尋結果 ↗';}

function renderExercise(){const day=workoutPlan[currentDayIndex],ex=day.exercises[currentExerciseIndex];$('workout-progress').textContent=`${currentExerciseIndex+1} / ${day.exercises.length}`;$('progress-fill').style.width=((currentExerciseIndex+1)/day.exercises.length*100)+'%';$('workout-ex-name').textContent=ex.name;$('workout-sets').textContent=ex.sets;$('workout-weight').textContent=ex.weight;setVideo(ex);const rec=getRecord();const setList=$('set-list');setList.innerHTML='';for(let i=0;i<ex.count;i++){const label=document.createElement('label');label.className='set-check';const cb=document.createElement('input');cb.type='checkbox';cb.checked=rec.done.includes(i);cb.setAttribute('aria-label',`第 ${i+1} 組完成`);cb.addEventListener('change',()=>{const r=getRecord();r.done=cb.checked?[...new Set([...r.done,i])]:r.done.filter(n=>n!==i);setRecord(r);});label.append(cb,document.createTextNode(`第 ${i+1} 組`));setList.appendChild(label)}$('actual-weight').value=rec.weight||'';$('actual-reps').value=rec.reps||'';$('btn-prev').disabled=currentExerciseIndex===0;$('btn-next').textContent=currentExerciseIndex===day.exercises.length-1?'完成訓練 ✓':'下一個動作 →';stopTimer();resetTimer();}
function saveFields(){const r=getRecord();r.weight=$('actual-weight').value;r.reps=$('actual-reps').value;setRecord(r)}function startWorkout(){currentExerciseIndex=0;renderExercise();navigate('workout')}
function changeExercise(step){saveFields();const day=workoutPlan[currentDayIndex],next=currentExerciseIndex+step;if(next<0)return;if(next>=day.exercises.length){showSummary();return}currentExerciseIndex=next;renderExercise();window.scrollTo({top:0,behavior:'smooth'})}

function showSummary(){saveFields();const day=workoutPlan[currentDayIndex];let total=0,done=0;$('summary-title').textContent=day.title;const list=$('summary-list');list.innerHTML='';day.exercises.forEach((ex,i)=>{const r=records[`${day.id}-${i}`]||{done:[]};total+=ex.count;done+=(r.done||[]).length;const item=document.createElement('div');item.className='summary-item';item.innerHTML=`<span>${ex.name}</span><strong>${(r.done||[]).length} / ${ex.count} 組</strong>`;list.appendChild(item)});$('summary-score').textContent=`${done} / ${total} 組`; $('summary-message').textContent=done===total?'太好了，所有組數都已勾選完成！':`已完成 ${Math.round(done/total*100)}% 的組數；未勾選的組數可留待下次補完。`;navigate('summary')}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}timerEnd=0;$('timer-start').textContent='開始計時'}function resetTimer(){stopTimer();timerSeconds=90;updateTimer()}function updateTimer(){const s=Math.max(0,timerSeconds);$('timer-display').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTimer(){if(timerInterval){stopTimer();return}if(timerSeconds<=0)timerSeconds=90;timerEnd=Date.now()+timerSeconds*1000;$('timer-start').textContent='暫停計時';timerInterval=setInterval(()=>{timerSeconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));updateTimer();if(timerSeconds<=0){stopTimer();showToast('休息結束，可以開始下一組！');if('vibrate'in navigator)navigator.vibrate([150,80,150])}},250)}

$('back-home').onclick=()=>navigate('home');$('start-workout').onclick=startWorkout;$('exit-workout').onclick=()=>{if(confirm('要離開這次訓練嗎？已勾選的組數與重量會保留。')){saveFields();navigate('overview')}};$('btn-prev').onclick=()=>changeExercise(-1);$('btn-next').onclick=()=>changeExercise(1);$('summary-home').onclick=()=>navigate('home');$('summary-done').onclick=()=>navigate('home');$('timer-start').onclick=startTimer;$('timer-reset').onclick=resetTimer;$('actual-weight').addEventListener('change',saveFields);$('actual-reps').addEventListener('change',saveFields);

renderHome();
</script>
</body>
</html>
