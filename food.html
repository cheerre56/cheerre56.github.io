<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>行動營養追蹤</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#121212',
                            surface: '#1e1e1e',
                            surfaceLight: '#2a2a2a'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        input {
            -webkit-user-select: text;
            user-select: text;
        }

        button {
            touch-action: manipulation;
        }
        
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .tap-effect:active {
            transform: scale(0.96);
        }

        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
        }
        .toast-show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen pb-24 font-sans selection:bg-blue-500/30">

    <div class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Header -->
        <header class="pt-4 pb-2 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">今日進度</h1>
                <p id="date-display" class="text-gray-400 text-sm mt-1"></p>
            </div>
            <div class="text-right">
                <button onclick="undo()" id="undo-btn" class="tap-effect text-gray-400 hover:text-white px-3 py-2 bg-dark-surface rounded-lg opacity-50 transition-opacity flex items-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> <span class="text-sm font-medium">復原</span>
                </button>
            </div>
        </header>

        <!-- Progress Cards Section -->
        <section class="grid grid-cols-2 gap-3" id="progress-container">
            <!-- 透過 JS 動態產生進度卡片 -->
        </section>

        <!-- Quick Add Section -->
        <section class="pt-2">
            <h2 class="text-lg font-bold mb-3 text-gray-200">快速紀錄</h2>
            <div class="grid grid-cols-2 gap-3">
                
                <button onclick="addFood('muscleMeal', '增肌餐')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-orange-500/50 transition-colors h-28 relative overflow-hidden">
                    <span class="text-3xl mb-1">🍱</span>
                    <span class="font-bold text-sm">增肌餐</span>
                    <span class="text-[10px] text-gray-400 mt-1">31g Pro / 595 kcal</span>
                </button>

                <button onclick="addFood('chicken', '雞胸肉')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-red-500/50 transition-colors h-28 relative overflow-hidden">
                    <span class="text-3xl mb-1">🥩</span>
                    <span class="font-bold text-sm">雞胸肉 100g</span>
                    <span class="text-[10px] text-gray-400 mt-1">23.6g Pro / 117 kcal</span>
                </button>

                <button onclick="addFood('egg', '茶葉蛋')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-yellow-500/50 transition-colors h-28 relative overflow-hidden">
                    <span class="text-3xl mb-1">🥚</span>
                    <span class="font-bold text-sm">茶葉蛋</span>
                    <span class="text-[10px] text-gray-400 mt-1">7g Pro / 75 kcal</span>
                </button>

                <button onclick="addFood('banana', '香蕉')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-yellow-300/50 transition-colors h-28 relative overflow-hidden">
                    <span class="text-3xl mb-1">🍌</span>
                    <span class="font-bold text-sm">香蕉</span>
                    <span class="text-[10px] text-gray-400 mt-1">23g Carb / 90 kcal</span>
                </button>
                
                <button onclick="addFood('whey', '蛋白粉')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-indigo-500/50 transition-colors h-28 relative overflow-hidden">
                    <span class="text-3xl mb-1">🥤</span>
                    <span class="font-bold text-sm">蛋白粉</span>
                    <span class="text-[10px] text-gray-400 mt-1">21.3g Pro / 113 kcal</span>
                </button>
                
                <button onclick="addFood('superProtein', '超能蛋白飲')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-pink-500/50 transition-colors h-28 relative overflow-hidden">
                    <span class="text-3xl mb-1">🧃</span>
                    <span class="font-bold text-sm">超能蛋白飲</span>
                    <span class="text-[10px] text-gray-400 mt-1">20.3g Pro / 206 kcal</span>
                </button>

                <button onclick="addFood('sevenElevenProtein', '7-11蛋白飲')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-blue-400/50 transition-colors h-28 relative overflow-hidden">
                    <span class="text-3xl mb-1">🥛</span>
                    <span class="font-bold text-sm">7-11蛋白飲</span>
                    <span class="text-[10px] text-gray-400 mt-1">22.2g Pro / 224 kcal</span>
                </button>

                <button onclick="addFood('creatine', '補充肌酸')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-purple-500/50 transition-colors h-28 relative overflow-hidden">
                    <span class="text-3xl mb-1">⚡</span>
                    <span class="font-bold text-sm">肌酸 5g</span>
                    <span class="text-[10px] text-gray-400 mt-1">力量補充</span>
                </button>

                <button onclick="addFood('water', '喝水 300ml')" class="tap-effect col-span-2 flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-cyan-500/50 transition-colors h-24 relative overflow-hidden">
                    <span class="text-3xl mb-1">💧</span>
                    <span class="font-bold text-sm">喝水 300ml</span>
                </button>
            </div>
            
            <button onclick="showManualModal()" class="w-full mt-3 tap-effect py-4 bg-dark-surface hover:bg-gray-800 text-white font-bold rounded-2xl border border-gray-800 flex items-center justify-center gap-2 transition-colors shadow-sm">
                <span class="text-xl">✍️</span> 手動輸入
            </button>
        </section>

        <!-- Reset Button -->
        <section class="pt-6">
            <button onclick="showResetModal()" class="w-full tap-effect py-4 bg-red-900/30 text-red-400 font-bold rounded-xl border border-red-900/50 flex items-center justify-center gap-2">
                <i class="fa-solid fa-trash-can"></i> 重置今日紀錄
            </button>
        </section>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white text-gray-900 px-6 py-3 rounded-full font-bold shadow-xl transition-all duration-300 toast-enter z-50 pointer-events-none flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-green-500"></i>
        <span id="toast-msg">已加入</span>
    </div>

    <!-- Reset Confirmation Modal -->
    <div id="reset-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-dark-surface p-6 rounded-2xl max-w-sm w-[90%] border border-gray-700 transform scale-95 transition-transform duration-200" id="reset-modal-content">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-red-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-triangle-exclamation text-3xl text-red-500"></i>
                </div>
                <h3 class="text-xl font-bold">確定要重置嗎？</h3>
                <p class="text-gray-400 text-sm mt-2">這將會把今天的進度全部歸零，此動作無法復原。</p>
            </div>
            <div class="flex gap-3">
                <button onclick="closeResetModal()" class="flex-1 py-3 bg-gray-800 text-white rounded-xl font-bold">取消</button>
                <button onclick="confirmReset()" class="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold">確定重置</button>
            </div>
        </div>
    </div>

    <!-- Manual Entry Modal -->
    <div id="manual-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-dark-surface p-6 rounded-2xl max-w-sm w-[90%] border border-gray-700 transform scale-95 transition-transform duration-200 overflow-y-auto max-h-[90vh]" id="manual-modal-content">
            <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><span class="text-2xl">✍️</span> 手動輸入</h3>
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div>
                    <label class="text-sm text-gray-400 block mb-1">熱量 (kcal)</label>
                    <input type="number" id="manual-kcal" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-orange-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
                <div>
                    <label class="text-sm text-gray-400 block mb-1">蛋白質 (g)</label>
                    <input type="number" id="manual-protein" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
                <div>
                    <label class="text-sm text-gray-400 block mb-1">碳水 (g)</label>
                    <input type="number" id="manual-carbs" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-yellow-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
                <div>
                    <label class="text-sm text-gray-400 block mb-1">脂肪 (g)</label>
                    <input type="number" id="manual-fat" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-rose-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
                <div>
                    <label class="text-sm text-gray-400 block mb-1">鈉 (mg)</label>
                    <input type="number" id="manual-sodium" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-teal-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
                <div>
                    <label class="text-sm text-gray-400 block mb-1">糖 (g)</label>
                    <input type="number" id="manual-sugar" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-pink-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
                <div>
                    <label class="text-sm text-gray-400 block mb-1">水分 (ml)</label>
                    <input type="number" id="manual-water" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-cyan-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
                <div>
                    <label class="text-sm text-gray-400 block mb-1">肌酸 (g)</label>
                    <input type="number" id="manual-creatine" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-purple-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="closeManualModal()" class="flex-1 py-3 bg-gray-800 text-white rounded-xl font-bold">取消</button>
                <button onclick="submitManualEntry()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold">確定添加</button>
            </div>
        </div>
    </div>

    <script>
        // 營養素目標區間與色彩設定
        const targets = {
            kcal: { min: 2000, max: 2200, unit: 'kcal', name: '熱量', defaultBar: 'bg-orange-500', baseStyle: 'border-orange-500/30 bg-gradient-to-br from-orange-900/20 to-transparent' },
            protein: { min: 150, max: 170, unit: 'g', name: '蛋白質', defaultBar: 'bg-blue-500', baseStyle: 'border-blue-500/30 bg-gradient-to-br from-blue-900/20 to-transparent' },
            carbs: { min: 200, max: 230, unit: 'g', name: '碳水', defaultBar: 'bg-yellow-500', baseStyle: 'border-yellow-500/30 bg-gradient-to-br from-yellow-900/20 to-transparent' },
            fat: { min: 65, max: 75, unit: 'g', name: '脂肪', defaultBar: 'bg-rose-500', baseStyle: 'border-rose-500/30 bg-gradient-to-br from-rose-900/20 to-transparent' },
            sodium: { min: 0, max: 2300, unit: 'mg', name: '鈉', defaultBar: 'bg-teal-500', baseStyle: 'border-teal-500/30 bg-gradient-to-br from-teal-900/20 to-transparent' },
            sugar: { min: 0, max: 50, unit: 'g', name: '糖', defaultBar: 'bg-pink-500', baseStyle: 'border-pink-500/30 bg-gradient-to-br from-pink-900/20 to-transparent' },
            water: { min: 3000, max: 4000, unit: 'ml', name: '水分', defaultBar: 'bg-cyan-500', baseStyle: 'border-cyan-500/30 bg-gradient-to-br from-cyan-900/20 to-transparent' },
            creatine: { min: 3, max: 5, unit: 'g', name: '肌酸', defaultBar: 'bg-purple-500', baseStyle: 'border-purple-500/30 bg-gradient-to-br from-purple-900/20 to-transparent' }
        };

        const defaultState = { kcal: 0, protein: 0, carbs: 0, fat: 0, sodium: 0, sugar: 0, water: 0, creatine: 0 };
        
        // 快捷按鈕對應的精準數值
        const foodData = {
            muscleMeal: { kcal: 595, protein: 31.1, carbs: 72.4, fat: 20.1, sodium: 1123, sugar: 2.5, water: 0, creatine: 0 },
            egg: { kcal: 75, protein: 7, carbs: 0, fat: 5, sodium: 150, sugar: 0, water: 0, creatine: 0 },
            banana: { kcal: 90, protein: 1, carbs: 23, fat: 0, sodium: 1, sugar: 12, water: 0, creatine: 0 },
            chicken: { kcal: 117, protein: 23.6, carbs: 1.6, fat: 1.8, sodium: 620, sugar: 1.5, water: 0, creatine: 0 },
            whey: { kcal: 113, protein: 21.3, carbs: 4.2, fat: 1.1, sodium: 20, sugar: 0, water: 0, creatine: 0 },
            superProtein: { kcal: 206, protein: 20.3, carbs: 25.9, fat: 2.3, sodium: 274, sugar: 25.9, water: 0, creatine: 0 },
            sevenElevenProtein: { kcal: 224.7, protein: 22.2, carbs: 27.9, fat: 2.7, sodium: 126, sugar: 15.3, water: 0, creatine: 0 },
            creatine: { kcal: 0, protein: 0, carbs: 0, fat: 0, sodium: 0, sugar: 0, water: 0, creatine: 5 },
            water: { kcal: 0, protein: 0, carbs: 0, fat: 0, sodium: 0, sugar: 0, water: 300, creatine: 0 }
        };

        // 從 LocalStorage 載入資料並補齊可能缺失的新欄位
        let storedState = JSON.parse(localStorage.getItem('nutritionAppFullData'));
        let currentState = storedState ? { ...defaultState, ...storedState } : { ...defaultState };
        let historyStack = [];

        // 顯示日期
        const dateOptions = { month: 'long', day: 'numeric', weekday: 'short' };
        document.getElementById('date-display').innerText = new Date().toLocaleDateString('zh-TW', dateOptions);

        // 渲染畫面卡片
        function renderProgress() {
            const container = document.getElementById('progress-container');
            container.innerHTML = '';

            Object.keys(targets).forEach(key => {
                const info = targets[key];
                let currentVal = currentState[key] || 0;
                let current = Number(currentVal.toFixed(1));
                
                // 去除不必要的小數點
                if (current % 1 === 0) current = Math.round(current);
                
                // 計算進度條 (上限作為 100%)
                const percentage = Math.min((current / info.max) * 100, 100);
                
                // 預設狀態 (未達標)
                let barColor = info.defaultBar;
                let textColor = 'text-white';
                let cardStyle = info.baseStyle;

                // 狀態判斷
                if (current > info.max) {
                    // 超標警告 (紅色)
                    barColor = 'bg-red-500 shadow-[0_0_8px_#ef4444]';
                    textColor = 'text-red-500 font-bold';
                    cardStyle = 'border-red-500/50 bg-red-900/20';
                } else if (current >= info.min && current <= info.max) {
                    // 完美達標 (發光綠色)
                    barColor = 'bg-green-400 shadow-[0_0_8px_#4ade80]';
                    textColor = 'text-green-400 font-bold';
                    cardStyle = 'border-green-500/40 bg-green-900/20';
                }

                const card = `
                    <div class="rounded-2xl p-4 flex flex-col justify-between border ${cardStyle} transition-colors duration-300">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-gray-200 font-bold text-sm drop-shadow-md">${info.name}</span>
                        </div>
                        <div class="mb-2 flex items-baseline gap-1">
                            <span class="text-xl md:text-2xl font-black ${textColor} transition-colors duration-300">${current}</span>
                        </div>
                        <div class="text-[10px] text-gray-400 font-medium mb-1.5 drop-shadow-sm">
                            目標: ${info.min} - ${info.max} ${info.unit}
                        </div>
                        <div class="w-full bg-gray-800/80 h-2 rounded-full overflow-hidden">
                            <div class="${barColor} h-full rounded-full transition-all duration-700 ease-out" style="width: ${percentage}%"></div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });

            // 控制復原按鈕
            const undoBtn = document.getElementById('undo-btn');
            if (historyStack.length > 0) {
                undoBtn.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                undoBtn.classList.add('opacity-50', 'pointer-events-none');
            }
        }

        // 新增紀錄
        function addFood(foodKey, foodName) {
            historyStack.push(JSON.stringify(currentState));
            if(historyStack.length > 20) historyStack.shift(); // 限制紀錄長度

            const addition = foodData[foodKey];
            Object.keys(addition).forEach(key => {
                currentState[key] += addition[key];
            });

            saveAndRender();
            showToast(`已紀錄：${foodName}`);
        }

        // 復原
        function undo() {
            if (historyStack.length === 0) return;
            const prevStateStr = historyStack.pop();
            currentState = JSON.parse(prevStateStr);
            saveAndRender();
            showToast('已復原上一筆紀錄');
        }

        // 儲存至本地端
        function saveAndRender() {
            localStorage.setItem('nutritionAppFullData', JSON.stringify(currentState));
            renderProgress();
        }

        // 吐司通知
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            
            toast.classList.remove('toast-enter');
            toast.classList.add('toast-show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-show');
                toast.classList.add('toast-enter');
            }, 2500);
        }

        // 重置彈窗
        const modal = document.getElementById('reset-modal');
        const modalContent = document.getElementById('reset-modal-content');

        function showResetModal() {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeResetModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function confirmReset() {
            currentState = { ...defaultState };
            historyStack = []; 
            saveAndRender();
            closeResetModal();
            showToast('今日紀錄已歸零');
        }

        // 手動輸入彈窗
        const manualModal = document.getElementById('manual-modal');
        const manualModalContent = document.getElementById('manual-modal-content');

        function showManualModal() {
            manualModal.classList.remove('hidden');
            setTimeout(() => {
                manualModal.classList.remove('opacity-0');
                manualModalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeManualModal() {
            manualModal.classList.add('opacity-0');
            manualModalContent.classList.add('scale-95');
            setTimeout(() => {
                manualModal.classList.add('hidden');
                // 清空
                const inputs = ['kcal', 'protein', 'carbs', 'fat', 'sodium', 'sugar', 'water', 'creatine'];
                inputs.forEach(id => {
                    document.getElementById(`manual-${id}`).value = '';
                });
            }, 200);
        }

        function submitManualEntry() {
            const keys = ['kcal', 'protein', 'carbs', 'fat', 'sodium', 'sugar', 'water', 'creatine'];
            let hasInput = false;
            let tempState = { ...currentState };
            
            keys.forEach(key => {
                const val = parseFloat(document.getElementById(`manual-${key}`).value) || 0;
                if (val !== 0) {
                    hasInput = true;
                    tempState[key] += val;
                }
            });

            if (!hasInput) {
                closeManualModal();
                return; 
            }

            historyStack.push(JSON.stringify(currentState));
            if(historyStack.length > 20) historyStack.shift();

            currentState = tempState;
            saveAndRender();
            closeManualModal();
            showToast('已手動新增');
        }

        // 初始化
        renderProgress();
    </script>
</body>
</html>
