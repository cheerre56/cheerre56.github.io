<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>行動營養追蹤</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#121212',
                            surface: '#1e1e1e',
                            surfaceLight: '#2a2a2a'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 隱藏滾動條但保持可滾動 */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* 按鈕點擊動畫 */
        .tap-effect:active {
            transform: scale(0.96);
        }

        /* 吐司通知動畫 */
        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
        }
        .toast-show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen pb-24 font-sans selection:bg-blue-500/30">

    <div class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Header -->
        <header class="pt-4 pb-2 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">今日進度</h1>
                <p id="date-display" class="text-gray-400 text-sm mt-1"></p>
            </div>
            <div class="text-right">
                <button onclick="undo()" id="undo-btn" class="tap-effect text-gray-400 hover:text-white px-3 py-2 bg-dark-surface rounded-lg opacity-50 transition-opacity flex items-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> <span class="text-sm font-medium">復原</span>
                </button>
            </div>
        </header>

        <!-- Progress Cards Section -->
        <section class="grid grid-cols-2 gap-3" id="progress-container">
            <!-- 透過 JS 動態產生 -->
        </section>

        <!-- Quick Add Section -->
        <section class="pt-2">
            <h2 class="text-lg font-bold mb-3 text-gray-200">快速紀錄</h2>
            <div class="grid grid-cols-2 gap-3">
                <!-- 增肌餐 -->
                <button onclick="addFood('muscleMeal', '增肌餐')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-blue-500/50 transition-colors h-28">
                    <span class="text-3xl mb-2">🍱</span>
                    <span class="font-bold text-sm">增肌餐</span>
                    <span class="text-[10px] text-gray-400 mt-1">+595大卡 (蛋白質31.1g)</span>
                </button>

                <!-- 雞胸肉 -->
                <button onclick="addFood('chicken', '雞胸肉 100g')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-red-500/50 transition-colors h-28">
                    <span class="text-3xl mb-2">🍗</span>
                    <span class="font-bold text-sm">雞胸肉 100g</span>
                    <span class="text-[10px] text-gray-400 mt-1">+31g 蛋白質</span>
                </button>

                <!-- 茶葉蛋 -->
                <button onclick="addFood('egg', '茶葉蛋 1顆')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-yellow-500/50 transition-colors h-28">
                    <span class="text-3xl mb-2">🥚</span>
                    <span class="font-bold text-sm">茶葉蛋 1顆</span>
                    <span class="text-[10px] text-gray-400 mt-1">+7g 蛋白質</span>
                </button>

                <!-- 香蕉 -->
                <button onclick="addFood('banana', '香蕉 1根')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-yellow-300/50 transition-colors h-28">
                    <span class="text-3xl mb-2">🍌</span>
                    <span class="font-bold text-sm">香蕉 1根</span>
                    <span class="text-[10px] text-gray-400 mt-1">+27g 碳水</span>
                </button>
                
                <!-- 蛋白粉 -->
                <button onclick="addFood('whey', '蛋白粉 1匙')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-indigo-500/50 transition-colors h-28">
                    <span class="text-3xl mb-2">🥤</span>
                    <span class="font-bold text-sm">蛋白粉 1匙</span>
                    <span class="text-[10px] text-gray-400 mt-1">+21.3g 蛋白質</span>
                </button>

                <!-- 補充肌酸 -->
                <button onclick="addFood('creatine', '補充肌酸 5g')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-purple-500/50 transition-colors h-28">
                    <span class="text-3xl mb-2">⚡</span>
                    <span class="font-bold text-sm">肌酸 5g</span>
                    <span class="text-[10px] text-gray-400 mt-1">力量補充</span>
                </button>

                <!-- 喝水 -->
                <button onclick="addFood('water', '喝水 300ml')" class="tap-effect flex flex-col items-center justify-center p-4 bg-dark-surface rounded-2xl border border-gray-800 hover:border-cyan-500/50 transition-colors h-28">
                    <span class="text-3xl mb-2">💧</span>
                    <span class="font-bold text-sm">喝水 300ml</span>
                    <span class="text-[10px] text-gray-400 mt-1">保持水分</span>
                </button>
            </div>
            
            <!-- 手動輸入按鈕 -->
            <button onclick="showManualModal()" class="w-full mt-3 tap-effect py-4 bg-dark-surface hover:bg-gray-800 text-white font-bold rounded-2xl border border-gray-800 flex items-center justify-center gap-2 transition-colors">
                <span class="text-xl">✍️</span> 手動輸入
            </button>
        </section>

        <!-- Reset Button -->
        <section class="pt-6">
            <button onclick="showResetModal()" class="w-full tap-effect py-4 bg-red-900/30 text-red-400 font-bold rounded-xl border border-red-900/50 flex items-center justify-center gap-2">
                <i class="fa-solid fa-trash-can"></i> 重置今日紀錄
            </button>
        </section>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white text-gray-900 px-6 py-3 rounded-full font-bold shadow-xl transition-all duration-300 toast-enter z-50 pointer-events-none flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-green-500"></i>
        <span id="toast-msg">已加入</span>
    </div>

    <!-- Reset Confirmation Modal -->
    <div id="reset-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-dark-surface p-6 rounded-2xl max-w-sm w-[90%] border border-gray-700 transform scale-95 transition-transform duration-200" id="reset-modal-content">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-red-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-triangle-exclamation text-3xl text-red-500"></i>
                </div>
                <h3 class="text-xl font-bold">確定要重置嗎？</h3>
                <p class="text-gray-400 text-sm mt-2">這將會把今天的進度全部歸零，此動作無法復原。</p>
            </div>
            <div class="flex gap-3">
                <button onclick="closeResetModal()" class="flex-1 py-3 bg-gray-800 text-white rounded-xl font-bold">取消</button>
                <button onclick="confirmReset()" class="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold">確定重置</button>
            </div>
        </div>
    </div>

    <!-- Manual Entry Modal -->
    <div id="manual-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-dark-surface p-6 rounded-2xl max-w-sm w-[90%] border border-gray-700 transform scale-95 transition-transform duration-200 overflow-y-auto max-h-[90vh]" id="manual-modal-content">
            <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><span class="text-2xl">✍️</span> 手動輸入</h3>
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div>
                    <label class="text-sm text-gray-400 block mb-1">熱量 (kcal)</label>
                    <input type="number" id="manual-kcal" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-orange-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
                <div>
                    <label class="text-sm text-gray-400 block mb-1">蛋白質 (g)</label>
                    <input type="number" id="manual-protein" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
                <div>
                    <label class="text-sm text-gray-400 block mb-1">碳水 (g)</label>
                    <input type="number" id="manual-carbs" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-yellow-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
                <div>
                    <label class="text-sm text-gray-400 block mb-1">脂肪 (g)</label>
                    <input type="number" id="manual-fat" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-green-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
                <div>
                    <label class="text-sm text-gray-400 block mb-1">肌酸 (g)</label>
                    <input type="number" id="manual-creatine" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-purple-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
                <div>
                    <label class="text-sm text-gray-400 block mb-1">水分 (ml)</label>
                    <input type="number" id="manual-water" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-cyan-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
                <div>
                    <label class="text-sm text-gray-400 block mb-1">步數 (步)</label>
                    <input type="number" id="manual-steps" class="w-full bg-gray-800 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-700 placeholder-gray-600" placeholder="0">
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="closeManualModal()" class="flex-1 py-3 bg-gray-800 text-white rounded-xl font-bold">取消</button>
                <button onclick="submitManualEntry()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold">確定添加</button>
            </div>
        </div>
    </div>

    <script>
        // 設定目標與初始狀態
        const targets = {
            kcal: { target: 2100, unit: 'kcal', name: '熱量', color: 'bg-orange-500', textCol: 'text-orange-400' },
            protein: { target: 150, unit: 'g', name: '蛋白質', color: 'bg-blue-500', textCol: 'text-blue-400' },
            carbs: { target: 215, unit: 'g', name: '碳水', color: 'bg-yellow-500', textCol: 'text-yellow-400' },
            fat: { target: 70, unit: 'g', name: '脂肪', color: 'bg-green-500', textCol: 'text-green-400' },
            creatine: { target: 5, unit: 'g', name: '肌酸', color: 'bg-purple-500', textCol: 'text-purple-400' },
            water: { target: 3000, unit: 'ml', name: '水分', color: 'bg-cyan-500', textCol: 'text-cyan-400' },
            steps: { target: 10000, unit: '步', name: '步數', color: 'bg-indigo-500', textCol: 'text-indigo-400' }
        };

        const defaultState = { kcal: 0, protein: 0, carbs: 0, fat: 0, creatine: 0, water: 0, steps: 0 };
        
        // 快捷食物資料
        const foodData = {
            muscleMeal: { kcal: 595, protein: 31.1, carbs: 72.4, fat: 20.1, creatine: 0, water: 0 },
            chicken: { kcal: 165, protein: 31, carbs: 0, fat: 3.6, creatine: 0, water: 0 },
            egg: { kcal: 70, protein: 7, carbs: 1, fat: 5, creatine: 0, water: 0 },
            banana: { kcal: 105, protein: 1.3, carbs: 27, fat: 0.3, creatine: 0, water: 0 },
            whey: { kcal: 113, protein: 21.3, carbs: 4.2, fat: 1.1, creatine: 0, water: 0 },
            creatine: { kcal: 0, protein: 0, carbs: 0, fat: 0, creatine: 5, water: 0 },
            water: { kcal: 0, protein: 0, carbs: 0, fat: 0, creatine: 0, water: 300 }
        };

        let currentState = JSON.parse(localStorage.getItem('mobileNutritionState')) || { ...defaultState };
        let historyStack = []; // 用於復原

        // 顯示日期
        const dateOptions = { month: 'long', day: 'numeric', weekday: 'short' };
        document.getElementById('date-display').innerText = new Date().toLocaleDateString('zh-TW', dateOptions);

        // 初始化與渲染
        function renderProgress() {
            const container = document.getElementById('progress-container');
            container.innerHTML = '';

            Object.keys(targets).forEach(key => {
                const info = targets[key];
                // 加入 fallback 避免新增步數時舊存檔報錯
                let currentVal = currentState[key] || 0;
                let current = Number(currentVal.toFixed(1));
                // 若小數點為0則轉整數顯示
                if (current % 1 === 0) current = Math.round(current);
                
                const percentage = Math.min((current / info.target) * 100, 100);
                
                // 判斷視覺狀態 (未達標 / 剛好達標 / 超標)
                let barColor = info.color;
                let textColor = info.textCol;
                let cardStyle = 'border-gray-800 bg-dark-surface';

                if (current > info.target) {
                    // 超標狀態 (紅色警示)
                    barColor = 'bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.5)]';
                    textColor = 'text-[#ff4d4d] font-bold';
                    cardStyle = 'border-red-500/30 bg-red-900/10';
                } else if (current === info.target) {
                    // 剛好達標 (發光綠色)
                    barColor = 'bg-green-400 shadow-[0_0_10px_rgba(74,222,128,0.5)]';
                    textColor = 'text-green-400 font-bold';
                    cardStyle = 'border-green-500/30 bg-green-900/10';
                }

                const card = `
                    <div class="rounded-2xl p-4 flex flex-col justify-between border ${cardStyle} transition-colors duration-300">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-gray-300 font-medium text-sm">${info.name}</span>
                        </div>
                        <div class="mb-2 flex items-baseline gap-1">
                            <span class="text-xl md:text-2xl font-black ${textColor}">${current}</span>
                            <span class="text-[10px] text-gray-500 font-medium">/ ${info.target} ${info.unit}</span>
                        </div>
                        <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                            <div class="${barColor} h-full rounded-full transition-all duration-700 ease-out" style="width: ${percentage}%"></div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });

            // 更新 Undo 按鈕狀態
            const undoBtn = document.getElementById('undo-btn');
            if (historyStack.length > 0) {
                undoBtn.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                undoBtn.classList.add('opacity-50', 'pointer-events-none');
            }
        }

        // 新增食物
        function addFood(foodKey, foodName) {
            // 儲存當前狀態到歷史紀錄
            historyStack.push(JSON.stringify(currentState));
            // 限制歷史紀錄長度避免記憶體過大
            if(historyStack.length > 20) historyStack.shift();

            // 更新數值
            const addition = foodData[foodKey];
            Object.keys(addition).forEach(key => {
                currentState[key] += addition[key];
            });

            saveAndRender();
            showToast(`已紀錄：${foodName}`);
        }

        // 復原上一動
        function undo() {
            if (historyStack.length === 0) return;
            
            const prevStateStr = historyStack.pop();
            currentState = JSON.parse(prevStateStr);
            
            saveAndRender();
            showToast('已復原上一筆紀錄');
        }

        // 儲存與重新渲染
        function saveAndRender() {
            localStorage.setItem('mobileNutritionState', JSON.stringify(currentState));
            renderProgress();
        }

        // 吐司通知
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            
            toast.classList.remove('toast-enter');
            toast.classList.add('toast-show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-show');
                toast.classList.add('toast-enter');
            }, 2500);
        }

        // 自訂重置彈窗邏輯
        const modal = document.getElementById('reset-modal');
        const modalContent = document.getElementById('reset-modal-content');

        function showResetModal() {
            modal.classList.remove('hidden');
            // 延遲一點點讓 display block 先作用，再執行動畫
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeResetModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function confirmReset() {
            currentState = { ...defaultState };
            historyStack = []; // 重置也清空復原紀錄
            saveAndRender();
            closeResetModal();
            showToast('今日紀錄已歸零');
        }

        // 手動輸入彈窗邏輯
        const manualModal = document.getElementById('manual-modal');
        const manualModalContent = document.getElementById('manual-modal-content');

        function showManualModal() {
            manualModal.classList.remove('hidden');
            setTimeout(() => {
                manualModal.classList.remove('opacity-0');
                manualModalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeManualModal() {
            manualModal.classList.add('opacity-0');
            manualModalContent.classList.add('scale-95');
            setTimeout(() => {
                manualModal.classList.add('hidden');
                // 關閉時清空所有輸入框
                const inputs = ['kcal', 'protein', 'carbs', 'fat', 'creatine', 'water', 'steps'];
                inputs.forEach(id => {
                    document.getElementById(`manual-${id}`).value = '';
                });
            }, 200);
        }

        function submitManualEntry() {
            const kcal = parseFloat(document.getElementById('manual-kcal').value) || 0;
            const protein = parseFloat(document.getElementById('manual-protein').value) || 0;
            const carbs = parseFloat(document.getElementById('manual-carbs').value) || 0;
            const fat = parseFloat(document.getElementById('manual-fat').value) || 0;
            const creatine = parseFloat(document.getElementById('manual-creatine').value) || 0;
            const water = parseFloat(document.getElementById('manual-water').value) || 0;
            const steps = parseFloat(document.getElementById('manual-steps').value) || 0;

            // 檢查是否有輸入任何數值
            if (kcal === 0 && protein === 0 && carbs === 0 && fat === 0 && creatine === 0 && water === 0 && steps === 0) {
                closeManualModal();
                return; 
            }

            // 儲存當前狀態到歷史紀錄以供復原
            historyStack.push(JSON.stringify(currentState));
            if(historyStack.length > 20) historyStack.shift();

            // 加上輸入的數值
            currentState.kcal += kcal;
            currentState.protein += protein;
            currentState.carbs += carbs;
            currentState.fat += fat;
            currentState.creatine += creatine;
            currentState.water += water;
            currentState.steps = (currentState.steps || 0) + steps;

            saveAndRender();
            closeManualModal();
            showToast('已手動新增');
        }

        // 畫面載入時首次渲染
        renderProgress();
    </script>
</body>
</html>
